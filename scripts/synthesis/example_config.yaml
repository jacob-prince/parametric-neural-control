# Hyperparameter tuning settings
hp_tuning:
  enabled: true
  num_images: 3  # Number of images to use for tuning
  configs:
    - noise: 0.30
      decay: 2.5
      total_steps: 6000
      learning_rate: 12.0
      box_size: [0.90, 0.95]
    - noise: 0.25
      decay: 2.4
      total_steps: 6000
      learning_rate: 12.0
      box_size: [0.90, 0.95]
    - noise: 0.15
      decay: 2.0
      total_steps: 6000
      learning_rate: 12.0
      box_size: [0.90, 0.95]
    - noise: 0.1
      decay: 1.5
      total_steps: 6000
      learning_rate: 12.0
      box_size: [0.90, 0.95]
    - noise: 0.05
      decay: 1.2
      total_steps: 6000
      learning_rate: 12.0
      box_size: [0.90, 0.95]

# Feature Accentuation hyperparameters (default if tuning is disabled)
fa_hyperparameters:
  noise: 0.1
  decay: 1.5
  total_steps: 6000
  learning_rate: 12.0
  image_size: 1024
  model_input_size: 224
  values_range: [0.0, 1.0]
  crops_per_iteration: 8
  box_size: [0.90, 0.95]
  penalty: 0.0

# Other settings
extend_range: 0.25  # Percentage to extend range of target levels
num_levels: 11      # Number of target levels to generate
generate_gifs: true
bicubic_interpolation: false
generate_comprehensive_gifs: true